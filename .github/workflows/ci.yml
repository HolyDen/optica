name: CI

# Pushes to any branch, not only `main`: implementation happens on
# `build/v0.2.0` and is pushed at each pass boundary, so a `main`-only trigger
# would mean CI never runs during the build.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three runners from the start: development happens on Windows, so Linux
        # and macOS get no local coverage at all, and Windows filesystem
        # behaviour (reserved device names, trailing dots, path length) differs
        # from both. A Python version matrix arrives in pass 6.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # `optica[test]` carries pytest, Ruff and mypy only. The torch stack
        # never reaches CI.
        run: python -m pip install -e ".[test]"

      - name: Ruff
        run: ruff check

      - name: mypy
        run: mypy

      - name: Pytest
        # Anything importing torch is marked `slow` and runs locally instead.
        run: pytest -m "not slow"

      - name: optica --version with no torch installed
        run: optica --version
