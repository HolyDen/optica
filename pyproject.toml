[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "optica"
version = "0.1.1"
description = "A simple, powerful Computer Vision toolkit. Full release coming soon."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Python target is 3.11-3.13 (plan § "Tech Stack"). 3.10 is excluded: it reaches
# end of life on 31 October 2026. No `License ::` classifier -- under PEP 639 the
# SPDX `license` field above supersedes it.
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Tier 1 — Core. Required for `pip install optica` to be minimally functional.
# Pillow is Core because `optica fetch` needs it unconditionally for image validation.
dependencies = [
    "typer>=0.27,<1.0",
    "rich>=15.0,<16.0",
    "python-dotenv>=1.2,<2.0",
    "pydantic-settings>=2.15,<3.0",
    "httpx>=0.28,<1.0",
    "pillow>=12.3,<13.0",
]

# Tier 2 — Extras. Standard PyPI, no hardware detection, feature-gated.
# Tier 3 (torch, torchvision, timm, scikit-learn) is NEVER declared here:
# it installs through `optica setup`, which detects hardware and selects an index URL.
[project.optional-dependencies]
web = [
    "fastapi>=0.141,<1.0",
    "uvicorn>=0.52,<1.0",
]
clip = [
    "open-clip-torch>=3.3,<4.0",
]
all = [
    "optica[web,clip]",
]
# Non-user-facing. Installed once per CI matrix leg, so it holds only the test toolchain.
test = [
    "pytest>=9.1,<10.0",
    "ruff>=0.16,<1.0",
    "mypy>=2.3,<3.0",
]

[project.scripts]
optica = "optica.cli.main:app"

[project.urls]
Homepage = "https://github.com/HolyDen/optica"

# The specification and the working notes are repo-only: they are authority for
# how Optica gets built, not artifacts a user of the package needs.
[tool.hatch.build.targets.sdist]
exclude = [
    "spec/",
    "notes/",
]

[tool.pytest.ini_options]
markers = ["slow: requires torch"]
testpaths = ["tests"]

# CI runs bare `ruff check` and bare `mypy`, so both need to be told what to look
# at here — a green `mypy` that examined no files is not a check.
[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D", "ANN", "BLE"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D107",   # Google style documents __init__ args in the class docstring
    "ANN401", # *args/**kwargs on framework overrides are genuinely Any
]
# The en dash is the plan's own range character: `EXTRAS_REGISTRY`'s
# `size_estimate` values and the Review's download total are transcribed from
# § "Registry and resolution" exactly, and a hyphen there would print something
# the plan does not say. Every other confusable stays flagged.
allowed-confusables = ["–"]


[tool.ruff.lint.per-file-ignores]
# Test functions document themselves through their names, and their signatures
# are fixtures rather than an API surface.
"tests/**" = ["D100", "D101", "D102", "D103", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202"]

[tool.ruff.lint.flake8-bugbear]
# The Typer idiom: the option object *is* the default.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests stay type-checked, but a test function's signature is a list of fixtures
# rather than an API surface, so annotating every one adds noise without adding
# a check. Plan § "Coding Style" asks for full coverage of the package.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# `optica[web]` is declared but no CI leg installs it (plan § "Version-bound
# strategy"), so on a runner these modules do not exist and mypy must not fail
# on the import. Where the extra is installed, they are fully typed (py.typed).
module = ["fastapi", "fastapi.*", "starlette", "starlette.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The torch stack and `optica[clip]` never reach CI (plan § "Code Structure",
# CI/CD). Every import of them is lazy, inside a function, so Core imports
# cleanly without them; mypy must not fail on the import either. Where they are
# installed (the pass 4 `.venv`), torch and huggingface_hub are typed and checked.
module = [
    "torch", "torch.*", "torchvision", "torchvision.*", "timm", "timm.*",
    "sklearn", "sklearn.*", "open_clip", "open_clip.*",
    "huggingface_hub", "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The same absence, one level up: without the extra, FastAPI's decorators and
# response classes are `Any`, which strict mode reports as untyped decorators and
# `Any` returns. Relaxed only where FastAPI is used, and only those two checks.
module = ["optica.server.routes", "tests.unit.server.test_routes", "tests.integration.test_server"]
disallow_untyped_decorators = false
warn_return_any = false